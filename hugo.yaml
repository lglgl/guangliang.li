baseURL: "https://guangliang.li/"
languageCode: en-US
title: "江湖路远"
theme: "maupassant"
locale: "en-us"

enableRobotsTXT: true
enableEmoji: true

params:
  env: production
  description: "Technical notes on Cloud Computing, Kubernetes, DevOps, Security, Observability, and Infrastructure."
  author: "LI GUANGLIANG"
  defaultTheme: "maupassant"
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "LI GUANGLIANG"
    Content: "Cloud Computing · Kubernetes · DevOps · Security · Observability · Infrastructure"

menu:
  main:
    - name: "Posts"
      url: "/posts/"
      weight: 10

    - name: "Planning"
      url: "/planning/"
      weight: 20

    - name: "About"
      url: "/about/"
      weight: 40

taxonomies:
  category: categories

caches:
  images:
    dir: ":cacheDir/images"

permalinks:
  posts: "/:slugorcontentbasename"

markup:
  highlight:
    lineNos: true
    style: "github"