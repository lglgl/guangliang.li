baseURL: "http://localhost:1313/"
languageCode: en-US
title: "江湖路远"
theme: "maupassant"

enableRobotsTXT: true
enableEmoji: true

params:
  env: production
  description: "Technical notes on Cloud Computing, Kubernetes, DevOps, Security, Observability, and Infrastructure."
  author: "LI GUANGLIANG"
  defaultTheme: "maupassant"
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "LI GUANGLIANG"
    Content: "Cloud Computing · Kubernetes · DevOps · Security · Observability · Infrastructure"

menu:
  main:
    - name: "Posts"
      url: "posts/"
      weight: 10

    - name: "Categories"
      url: "categories/"
      weight: 20

    - name: "About"
      url: "about/"
      weight: 40

taxonomies:
  category: categories
  # tag: tags

caches:
  images:
    dir: ":cacheDir/images"

# Default post URL path: /post-title/
permalinks:
  posts: "/:slugorcontentbasename"

# Code highlighting
markup:
  highlight:
    lineNos: true
    style: "github"